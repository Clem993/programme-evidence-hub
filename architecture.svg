<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#1F2937}.h{font-family:Arial,sans-serif;font-weight:700;fill:#243447}.w{fill:#fff}.small{font-size:16px}.body{font-family:Arial,sans-serif;font-size:18px}.title{font-size:26px}.box{fill:#fff;stroke:#D9DEE5;stroke-width:2}.green{fill:#243447}.orange{fill:#3B82A0}.light{fill:#F3F5F7}.slate{fill:#3F4956}.line{stroke:#66758A;stroke-width:3;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66758A"/></marker></defs>
<rect width="1440" height="650" fill="#F3F5F7"/>
<text x="50" y="50" class="h title">Programme Evidence Hub prototype: loosely coupled, policy-controlled decision layer</text>
<text x="50" y="80" class="t small">Existing sources remain authoritative; the prototype registers, enriches, retrieves and connects decision-relevant evidence.</text>
<rect x="50" y="120" width="250" height="430" rx="0" class="box"/><rect x="50" y="120" width="250" height="55" class="green"/>
<text x="75" y="142" class="w body" font-family="Arial" font-weight="700"><tspan x="75">Authoritative </tspan><tspan x="75" dy="22">sources</tspan></text>
<text x="75" y="215" class="h body"><tspan x="75">Scientific </tspan><tspan x="75" dy="22">documents</tspan></text><text x="75" y="261" class="t small">PDF and PowerPoint</text>
<text x="75" y="300" class="h body">Structured results</text><text x="75" y="330" class="t small">CSV and source tables</text>
<text x="75" y="385" class="h body">Decision records</text><text x="75" y="415" class="t small"><tspan x="75">Word governance </tspan><tspan x="75" dy="22">records</tspan></text>
<text x="75" y="470" class="h body"><tspan x="75">External </tspan><tspan x="75" dy="22">intelligence</tspan></text><text x="75" y="516" class="t small">Curated, dated signals</text>
<rect x="365" y="120" width="310" height="430" class="box"/><rect x="365" y="120" width="310" height="55" class="orange"/>
<text x="390" y="155" class="w body" font-weight="700">Registry and governance</text>
<text x="390" y="215" class="h body">Source Registry</text><text x="390" y="245" class="t small"><tspan x="390">Owner, version, location, </tspan><tspan x="390" dy="22">checksum</tspan></text>
<text x="390" y="300" class="h body">Terminology mapping</text><text x="390" y="330" class="t small">Original and normalised terms</text>
<text x="390" y="385" class="h body">Role policy</text><text x="390" y="415" class="t small"><tspan x="390">Domain, classification, </tspan><tspan x="390" dy="22">explicit role</tspan></text>
<text x="390" y="470" class="h body">Ingestion lineage</text><text x="390" y="500" class="t small">Registered to human-reviewed</text>
<rect x="740" y="120" width="310" height="430" class="box"/><rect x="740" y="120" width="310" height="55" class="slate"/>
<text x="765" y="142" class="w body" font-family="Arial" font-weight="700"><tspan x="765">Semantic retrieval </tspan><tspan x="765" dy="22">and trace</tspan></text>
<text x="765" y="215" class="h body">Metadata enrichment</text><text x="765" y="245" class="t small"><tspan x="765">Programme and scientific </tspan><tspan x="765" dy="22">concepts</tspan></text>
<text x="765" y="300" class="h body">Hybrid retrieval</text><text x="765" y="330" class="t small"><tspan x="765">Structured, lexical, </tspan><tspan x="765" dy="22">semantic, graph</tspan></text>
<text x="765" y="385" class="h body">Evidence objects</text><text x="765" y="415" class="t small">Atomic claims and uncertainty</text>
<text x="765" y="470" class="h body">Retrieval trace</text><text x="765" y="500" class="t small"><tspan x="765">Query, route, concepts </tspan><tspan x="765" dy="22">and review</tspan></text>
<rect x="1115" y="120" width="275" height="430" class="box"/><rect x="1115" y="120" width="275" height="55" class="green"/>
<text x="1140" y="155" class="w body" font-family="Arial" font-weight="700">Role-based views</text>
<text x="1140" y="215" class="h body">Programme view</text><text x="1140" y="245" class="t small"><tspan x="1140">Decision status </tspan><tspan x="1140" dy="22">and evidence</tspan></text>
<text x="1140" y="300" class="h body">Decision workspace</text><text x="1140" y="330" class="t small"><tspan x="1140">Human rationale </tspan><tspan x="1140" dy="22">and conditions</tspan></text>
<text x="1140" y="385" class="h body">Signals and handover</text><text x="1140" y="415" class="t small"><tspan x="1140">Suggestions, actions, </tspan><tspan x="1140" dy="22">context</tspan></text>
<text x="1140" y="470" class="h body">Evaluation</text><text x="1140" y="500" class="t small"><tspan x="1140">Gold set, errors, citations, </tspan><tspan x="1140" dy="22">disposition</tspan></text>
<path d="M300 335 L365 335" class="line"/><path d="M675 335 L740 335" class="line"/><path d="M1050 335 L1115 335" class="line"/>
<rect x="365" y="575" width="685" height="45" class="green"/><text x="707.5" y="605" text-anchor="middle" class="w body" font-family="Arial" font-weight="700">Human review remains the approval boundary</text>
</svg>
